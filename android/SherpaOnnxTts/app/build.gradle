plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.k2fsa.sherpa.onnx'
    compileSdk 36

    defaultConfig {
        applicationId "com.k2fsa.sherpa.onnx"
        minSdk 26
        targetSdk 36
        versionCode 20261126
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // piper-phonemize provides the text frontend for models without a lexicon
    implementation 'com.github.csukuangfj.piper-phonemize:piper-phonemize:v1.6.1'
    // Google AI Edge LiteRT: CompiledModel API (CPU XNNPACK / GPU ML Drift) for Matcha-TTS .tflite graphs
    implementation 'com.google.ai.edge.litert:litert:2.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu:2.4.1'
    // MediaPipe TextToSpeech task: runs .litertlm bundles (PocketTTS, Kokoro-82M, Phonon-31M)
    implementation 'com.google.mediapipe:tasks-audio:1.2.3'
    // ExecuTorch for on-device PyTorch / QNN PTE programs (Reverb-TTS)
    implementation 'org.pytorch:executorch-android:0.6.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}